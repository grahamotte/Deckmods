[vars]
deck = "deck@192.168.1.239"
deck_c77 = "~/Desktop/c77/"
deck_sdv = "~/Desktop/sdv/"
deck_docs = "~/Desktop/docs/"

#
# Unapply
#

[tasks."unapply:docs"]
run = "ssh {{vars.deck}} 'python3 {{vars.deck_c77}}uninstall-mods.py'"

[tasks."unapply:c77"]
run = "echo noop"

[tasks."unapply:sdv"]
run = "ssh {{vars.deck}} 'python3 {{vars.deck_sdv}}uninstall-mods.py'"

[tasks.unapply]
depends = ["unapply:*"]

#
# Apply
#

[tasks."apply:docs"]
run = "rsync -av --delete docs/ {{vars.deck}}:{{vars.deck_docs}}"

[tasks."apply:c77"]
run = [
  "rsync -av --delete --exclude-from=.rsync-exclude c77/ {{vars.deck}}:{{vars.deck_c77}}",
  "ssh {{vars.deck}} 'python3 {{vars.deck_c77}}install-mods.py'",
]

[tasks."apply:sdv"]
run = [
  "rsync -av --delete --exclude-from=.rsync-exclude sdv/ {{vars.deck}}:{{vars.deck_sdv}}",
  "ssh {{vars.deck}} 'python3 {{vars.deck_sdv}}install-mods.py'",
]

[tasks.apply]
depends = ["apply:*"]

#
# git
#

[tasks.push]
description = "Fetch and safely push master to origin"
run = '''
set -euo pipefail
if [ "$(git remote get-url origin)" != "git@github.com:grahamotte/deckmods.git" ]; then
  echo "Refusing to push: origin must point to the GitHub workflow repository" >&2
  exit 1
fi
if [ "$(git remote)" != "origin" ]; then
  echo "Refusing to push: this repository must have only origin" >&2
  exit 1
fi
git fetch origin
git merge-base --is-ancestor origin/master master
git push origin master:refs/heads/master
'''
